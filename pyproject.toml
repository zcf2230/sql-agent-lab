[project]
name = "sql-agent-lab"
version = "0.1.0"
description = "A self-repairing Text-to-SQL agent with its own evaluation, tracing and ablation harness."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlglot>=25.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q would double up with a caller's own -q and print no "N passed" line, which is
# the one thing a reviewer is asked to check against docs/HANDOFF.md verbatim.
addopts = "-ra"
