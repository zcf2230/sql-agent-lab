# Why this file exists. Every "pytest is green" and "the published artifacts regenerate
# byte-identically" claim in README and docs/ was verifiable only by cloning the repo and
# building an environment first. Three external reviewers asked for exactly that and had to
# take it on trust; §4.2 of docs/HANDOFF.md lists the commands, and this runs that same list
# on a machine that has never seen my working directory.
#
# It deliberately does NOT regenerate report.html: that file embeds per-task traces from
# runs/, which is gitignored, so a fresh clone cannot reproduce it and a red build would
# be reporting a packaging choice rather than a defect. docs/figures/trace.svg skips for
# the same reason and says so out loud.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install from the lockfile
        # Not `pip install -e .`: that resolves "latest matching the range", so the build
        # would be testing whatever sqlglot published that morning - and the guard's
        # verdicts are sqlglot's AST classifications, i.e. the thing the two published
        # zeros are measured with. `--frozen` additionally fails the build when uv.lock
        # and pyproject disagree, instead of silently resolving a different tree.
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev

      - name: rebuild derived data the tests need
        run: uv run python -m sqlagent.data.build_db   # data/*.db is gitignored by design

      - name: tests
        shell: bash
        run: |
          set +e
          uv run python -m pytest -q --color=no --tb=short 2>&1 | tee .pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # A red build has to be diagnosable by a reader who is only allowed to look at
            # a public repository: run logs need a token, check-run annotations do not.
            # `%` and `:` are escaped in the payload first, then the keyword is prepended.
            grep -E '^(FAILED|ERROR)' .pytest.log | head -15 | sed -e 's/%/%25/g' -e 's/:/%3A/g' | while IFS= read -r line; do echo "::error::$line"; done
            tail -12 .pytest.log | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '~' | sed -e 's/^/::error::tail%20> /'
          fi
          exit "$rc"

      # The strongest step: the numbers in README and in the docs are re-derived from
      # code and data, and the tree must still be clean afterwards. If a documented
      # artifact no longer follows from the code that produces it, this fails - which is
      # the class of bug this project kept rediscovering by hand.
      - name: published artifacts must regenerate byte-identically
        run: |
          uv run python -m sqlagent.data.build_tasks
          uv run python scripts/calibrate.py
          uv run python scripts/guard_corpus.py
          uv run python -m sqlagent.figures
          git diff --exit-code

      - name: show what a reviewer would see
        if: always()
        run: uv run python scripts/significance.py
