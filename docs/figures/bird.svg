<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 728" width="100%" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"><title>Grader vs the public benchmark&#x27;s own comparison rule</title><rect width="980" height="728" fill="#12141a"/><text x="20" y="34" font-size="16" fill="#e6e8ef" text-anchor="start" font-weight="600">同一个判分器，搬到别人写的题上（BIRD dev）</text><text x="20" y="56" font-size="12" fill="#8b8fa3" text-anchor="start" font-weight="normal">120 道人写 gold、11 个真实库、460 条注入观测；条长按可比观测数缩放</text><text x="20" y="78" font-size="11" fill="#5b7fd6" text-anchor="start" font-weight="normal">蓝＝与公开口径一致</text><text x="200" y="78" font-size="11" fill="#e07a6b" text-anchor="start" font-weight="normal">红＝公开口径看不见（我判错）</text><text x="470" y="78" font-size="11" fill="#c98a4b" text-anchor="start" font-weight="normal">橙＝我比公开口径宽松</text><text x="940" y="78" font-size="11" fill="#8b8fa3" text-anchor="end" font-weight="normal">gold 判 gold</text><text x="940" y="96" font-size="13" fill="#4f9d8f" text-anchor="end" font-weight="600">120/120</text><text x="20" y="144" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">reflow</text><text x="20" y="164" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">同义重写（语义不变）</text><rect x="260.0" y="132" width="227.3" height="26" rx="3" fill="#5b7fd6"/><text x="716" y="144" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 62</text><text x="716" y="164" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 0</text><text x="20" y="206" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">reorder_cols</text><text x="20" y="226" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">列顺序颠倒（值不变）</text><rect x="260.0" y="194" width="124.7" height="26" rx="3" fill="#c98a4b"/><text x="716" y="206" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 34</text><text x="716" y="226" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 34</text><text x="20" y="268" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">float_round</text><text x="20" y="288" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">末列舍入到 1 位</text><rect x="260.0" y="256" width="311.7" height="26" rx="3" fill="#5b7fd6"/><rect x="571.7" y="256" width="102.7" height="26" rx="3" fill="#c98a4b"/><text x="716" y="268" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 113</text><text x="716" y="288" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 28</text><text x="20" y="330" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">drop_distinct</text><text x="20" y="350" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">去掉 DISTINCT（多出重复行）</text><rect x="260.0" y="318" width="7.3" height="26" rx="3" fill="#5b7fd6"/><rect x="267.3" y="318" width="40.3" height="26" rx="3" fill="#e07a6b"/><text x="716" y="330" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 13</text><text x="716" y="350" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 11 · 我更宽 0</text><text x="20" y="392" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">wrong_limit</text><text x="20" y="412" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">强行 LIMIT 3</text><rect x="260.0" y="380" width="425.3" height="26" rx="3" fill="#5b7fd6"/><rect x="685.3" y="380" width="7.3" height="26" rx="3" fill="#e07a6b"/><text x="716" y="392" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 118</text><text x="716" y="412" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 2 · 我更宽 0</text><text x="20" y="454" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">bad_column</text><text x="20" y="474" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">列名改成不存在的</text><rect x="260.0" y="442" width="440.0" height="26" rx="3" fill="#5b7fd6"/><text x="716" y="454" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 120</text><text x="716" y="474" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 0</text><text x="20" y="518" font-size="12" fill="#8b8fa3" text-anchor="start" font-weight="normal">分歧两个方向都有：不拿&quot;官方看不见重复行&quot;冒充&quot;我的判分器更好&quot;</text><text x="20" y="558" font-size="14" fill="#e6e8ef" text-anchor="start" font-weight="600">同一个 agent、同一份判分器，换一套考卷</text><text x="20" y="598" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">自制基准</text><text x="20" y="616" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">192 题 · 我造的题、我写的 gold</text><rect x="651.9" y="586" width="3" height="20" fill="#5b7fd6"/><line x1="629.0" y1="594" x2="668.0" y2="594" stroke="#8b8fa3"/><line x1="629.0" y1="587" x2="629.0" y2="601" stroke="#8b8fa3"/><line x1="668.0" y1="587" x2="668.0" y2="601" stroke="#8b8fa3"/><text x="716" y="596" font-size="11" fill="#e6e8ef" text-anchor="start" font-weight="normal">89.1%  [83.9%, 92.7%]</text><text x="716" y="614" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">同一模型同一配置</text><text x="20" y="644" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">BIRD dev</text><text x="20" y="662" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">60 题 · 人写题、11 个真实库</text><rect x="443.3" y="632" width="3" height="20" fill="#5b7fd6"/><line x1="392.3" y1="640" x2="498.8" y2="640" stroke="#8b8fa3"/><line x1="392.3" y1="633" x2="392.3" y2="647" stroke="#8b8fa3"/><line x1="498.8" y1="633" x2="498.8" y2="647" stroke="#8b8fa3"/><text x="716" y="642" font-size="11" fill="#e6e8ef" text-anchor="start" font-weight="normal">41.7%  [30.1%, 54.3%]</text><text x="716" y="660" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">官方口径同分（25/60）</text><text x="260.0" y="690" font-size="10" fill="#8b8fa3" text-anchor="middle" font-weight="normal">0%</text><text x="370.0" y="690" font-size="10" fill="#8b8fa3" text-anchor="middle" font-weight="normal">25%</text><text x="480.0" y="690" font-size="10" fill="#8b8fa3" text-anchor="middle" font-weight="normal">50%</text><text x="590.0" y="690" font-size="10" fill="#8b8fa3" text-anchor="middle" font-weight="normal">75%</text><text x="700.0" y="690" font-size="10" fill="#8b8fa3" text-anchor="middle" font-weight="normal">100%</text><text x="20" y="712" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">两条须线不重叠：差距不是抽样噪声。BIRD 那 60 题在两套口径下判定完全一致，所以差距来自考卷，不来自判分器。</text></svg>