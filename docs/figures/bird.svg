<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 556" width="100%" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"><title>Grader vs the public benchmark&#x27;s own comparison rule</title><rect width="980" height="556" fill="#12141a"/><text x="20" y="34" font-size="16" fill="#e6e8ef" text-anchor="start" font-weight="600">同一个判分器，搬到别人写的题上（BIRD dev）</text><text x="20" y="56" font-size="12" fill="#8b8fa3" text-anchor="start" font-weight="normal">120 道人写 gold、11 个真实库、460 条注入观测；条长按可比观测数缩放</text><text x="20" y="78" font-size="11" fill="#5b7fd6" text-anchor="start" font-weight="normal">蓝＝与公开口径一致</text><text x="200" y="78" font-size="11" fill="#e07a6b" text-anchor="start" font-weight="normal">红＝公开口径看不见（我判错）</text><text x="470" y="78" font-size="11" fill="#c98a4b" text-anchor="start" font-weight="normal">橙＝我比公开口径宽松</text><text x="940" y="78" font-size="11" fill="#8b8fa3" text-anchor="end" font-weight="normal">gold 判 gold</text><text x="940" y="96" font-size="13" fill="#4f9d8f" text-anchor="end" font-weight="600">120/120</text><text x="20" y="144" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">reflow</text><text x="20" y="164" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">同义重写（语义不变）</text><rect x="260.0" y="132" width="227.3" height="26" rx="3" fill="#5b7fd6"/><text x="716" y="144" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 62</text><text x="716" y="164" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 0</text><text x="20" y="206" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">reorder_cols</text><text x="20" y="226" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">列顺序颠倒（值不变）</text><rect x="260.0" y="194" width="124.7" height="26" rx="3" fill="#c98a4b"/><text x="716" y="206" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 34</text><text x="716" y="226" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 34</text><text x="20" y="268" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">float_round</text><text x="20" y="288" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">末列舍入到 1 位</text><rect x="260.0" y="256" width="311.7" height="26" rx="3" fill="#5b7fd6"/><rect x="571.7" y="256" width="102.7" height="26" rx="3" fill="#c98a4b"/><text x="716" y="268" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 113</text><text x="716" y="288" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 28</text><text x="20" y="330" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">drop_distinct</text><text x="20" y="350" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">去掉 DISTINCT（多出重复行）</text><rect x="260.0" y="318" width="7.3" height="26" rx="3" fill="#5b7fd6"/><rect x="267.3" y="318" width="40.3" height="26" rx="3" fill="#e07a6b"/><text x="716" y="330" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 13</text><text x="716" y="350" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 11 · 我更宽 0</text><text x="20" y="392" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">wrong_limit</text><text x="20" y="412" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">强行 LIMIT 3</text><rect x="260.0" y="380" width="425.3" height="26" rx="3" fill="#5b7fd6"/><rect x="685.3" y="380" width="7.3" height="26" rx="3" fill="#e07a6b"/><text x="716" y="392" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 118</text><text x="716" y="412" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 2 · 我更宽 0</text><text x="20" y="454" font-size="13" fill="#e6e8ef" text-anchor="start" font-weight="normal">bad_column</text><text x="20" y="474" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">列名改成不存在的</text><rect x="260.0" y="442" width="440.0" height="26" rx="3" fill="#5b7fd6"/><text x="716" y="454" font-size="12" fill="#e6e8ef" text-anchor="start" font-weight="normal">可比 120</text><text x="716" y="474" font-size="11" fill="#8b8fa3" text-anchor="start" font-weight="normal">看不见 0 · 我更宽 0</text><text x="20" y="518" font-size="12" fill="#8b8fa3" text-anchor="start" font-weight="normal">分歧两个方向都有：不拿&quot;官方看不见重复行&quot;冒充&quot;我的判分器更好&quot;</text></svg>